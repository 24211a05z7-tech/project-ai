version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: projectflow_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: projectflow

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: projectflow_backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '5000:5000'
    environment:
      PORT: '5000'
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/projectflow
      JWT_SECRET: change_me_dev_secret
      JWT_REFRESH_SECRET: change_me_dev_refresh_secret
      CLIENT_URL: http://localhost:3000
      UPLOAD_DIR: uploads
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: projectflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      NEXT_PUBLIC_SOCKET_URL: http://localhost:5000

volumes:
  mongo_data:
